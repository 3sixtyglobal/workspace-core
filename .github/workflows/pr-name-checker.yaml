name: PR Name Checker

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-name-checker:
    # Release-please PRs are skipped here rather than via [skip ci], because the
    # production release PR's closed event must still trigger publishing.
    if: ${{ !startsWith(github.head_ref, 'release-please--') && (github.event.action != 'edited' || github.event.changes.title != null) }}
    runs-on: ubuntu-slim

    steps:
      # The runner image has Node.js and npm, so npx fetches just the current linter and the
      # conventional commit rules, and no checkout or install is needed. The title is passed
      # through the environment rather than interpolated into the script, so it cannot be
      # executed by the shell.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$PR_TITLE" | npx --yes --package @commitlint/cli --package @commitlint/config-conventional commitlint --extends @commitlint/config-conventional
